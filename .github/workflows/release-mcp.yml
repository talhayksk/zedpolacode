name: Release zpolacode-mcp

# Binary release train for the MCP server. Separate from the extension's v* tags.
#
# CONTRACT (the thin Zed extension, Phase 3, is written against this — do not rename):
#   https://github.com/talhayksk/zedpolacode/releases/download/mcp-v<version>/zpolacode-mcp-<target>.zip
#   <version>  = the `version` field of crates/mcp/Cargo.toml (0.3.0 today)
#   zip root   = exactly one file: zpolacode-mcp.exe on Windows, zpolacode-mcp elsewhere
#   release    = those five zips plus sha256sums.txt at the release root
#
# Tag push  mcp-v<version>  -> build, package, publish a GitHub Release.
# Dispatch                  -> build and package only, no release (dry run).

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-mcp-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MCP_MANIFEST: crates/mcp/Cargo.toml

jobs:
  # A tag that disagrees with the crate version would publish a mislabelled release,
  # so this runs before anything is built and fails fast.
  version:
    name: Tag matches crate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare mcp-v<tag> with crates/mcp/Cargo.toml
        id: check
        shell: bash
        run: |
          set -eu
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$MCP_MANIFEST" | head -n1)
          if [ -z "$version" ]; then
            echo "::error::No version field found in $MCP_MANIFEST"
            exit 1
          fi
          echo "crate version: $version"

          case "$GITHUB_REF" in
            refs/tags/*)
              tag="$GITHUB_REF_NAME"
              case "$tag" in
                mcp-v*) tagged="${tag#mcp-v}" ;;
                *)
                  echo "::error::Tag '$tag' does not match mcp-v<version>."
                  exit 1
                  ;;
              esac
              if [ "$tagged" != "$version" ]; then
                echo "::error::Tag '$tag' says $tagged but $MCP_MANIFEST says $version. Bump the crate, then tag."
                exit 1
              fi
              echo "OK: $tag matches $version"
              ;;
            *)
              echo "Dry run on $GITHUB_REF: no tag to compare, crate version is $version."
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The suite is browser-free, so this is a plain cargo run.
  test:
    name: Format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test -p zpolacode-mcp
        run: cargo test --locked -p zpolacode-mcp

  build:
    name: Build ${{ matrix.target }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    # Signing is optional: each step below only runs when its secret exists, so a
    # release without certificates is still built, just annotated as unsigned.
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # target triple, pinned runner, and whether that runner can execute the result
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-15
            smoke: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            smoke: false # cross-compiled on x64; cannot be executed on this runner
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Only aarch64 Linux is cross-compiled: rustc emits the object code, the
      # system cross-gcc links it. Without the linker variable the build stops at link time.
      - name: Wire the aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: cargo build
        run: cargo build --locked -p zpolacode-mcp --release --target ${{ matrix.target }}

      # The binary is a stdio server: it blocks on stdin, so feed it one ping line.
      - name: Smoke test the binary
        if: matrix.smoke
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/zpolacode-mcp"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          out=$(printf '{"jsonrpc":"2.0","id":1,"method":"ping"}\n' | "$bin")
          echo "reply: $out"
          case "$out" in
            *'"result":{}'*) echo "ping answered" ;;
            *)
              echo "::error::zpolacode-mcp did not answer ping"
              exit 1
              ;;
          esac

      # Cross-compiled, so it cannot be executed here. At least prove the linker
      # produced an aarch64 object and not an x86 one.
      - name: Verify the cross-compiled binary is aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -eu
          file "target/${{ matrix.target }}/release/zpolacode-mcp"
          file "target/${{ matrix.target }}/release/zpolacode-mcp" | grep -qi 'aarch64'

      # Signing happens before packaging on purpose: the zip hashes in
      # sha256sums.txt must cover the signed bytes, not the raw build output.
      - name: Sign the Windows binary (Authenticode)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK.' }

          $binary = "target/${{ matrix.target }}/release/zpolacode-mcp.exe"
          try {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $binary
            if ($LASTEXITCODE -ne 0) { throw "signtool sign exited $LASTEXITCODE" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

          $signature = Get-AuthenticodeSignature $binary
          Write-Host "signature: $($signature.Status) — $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "The signed binary does not verify: $($signature.Status)" }

      - name: Note that the Windows binary is unsigned
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX == ''
        shell: pwsh
        run: Write-Host '::warning::No WINDOWS_CERT_PFX_BASE64 secret; this build is unsigned and SmartScreen will warn.'

      - name: Sign the macOS binary (Developer ID)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/signing.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$certificate"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

          binary="target/${{ matrix.target }}/release/zpolacode-mcp"
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

      - name: Note that the macOS binary is unsigned
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 == ''
        shell: bash
        run: echo '::warning::No MACOS_CERT_P12_BASE64 secret; this build is unsigned and Gatekeeper will warn.'

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "zpolacode-mcp-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/zpolacode-mcp.exe" -DestinationPath $zip -Force
          # One "<hash>  <name>" line, LF-terminated, so the aggregated
          # sha256sums.txt verifies with `sha256sum -c` on Linux and macOS.
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n", (New-Object Text.UTF8Encoding $false))
          Write-Host "sha256 $hash"

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          zip="zpolacode-mcp-${{ matrix.target }}.zip"
          out="$PWD/$zip"
          (cd "target/${{ matrix.target }}/release" && zip -q "$out" zpolacode-mcp)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$zip" > "$zip.sha256"
          else
            shasum -a 256 "$zip" > "$zip.sha256" # macOS
          fi
          cat "$zip.sha256"

      # The notary ticket lives on Apple's servers, not in the archive: a bare
      # executable cannot be stapled, so the first launch needs network access.
      # The status is checked explicitly because a rejected submission is still a
      # successful tool invocation.
      - name: Notarise the macOS archive
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          result=$(xcrun notarytool submit "zpolacode-mcp-${{ matrix.target }}.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json)
          echo "$result"

          status=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          id=$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarisation was $status"
            xcrun notarytool log "$id" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            exit 1
          fi

      # The extension unpacks a fixed relative name, so the layout is part of the contract.
      - name: Verify archive layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "zpolacode-mcp-${{ matrix.target }}.zip").Path)
          try { $names = @($zip.Entries | ForEach-Object FullName) } finally { $zip.Dispose() }
          Write-Host "entries: $($names -join ', ')"
          if ($names.Count -ne 1 -or $names[0] -ne 'zpolacode-mcp.exe') {
            throw "The zip must contain exactly zpolacode-mcp.exe at its root."
          }

      - name: Verify archive layout (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          names=$(unzip -Z1 "zpolacode-mcp-${{ matrix.target }}.zip")
          echo "entries: $names"
          if [ "$names" != "zpolacode-mcp" ]; then
            echo "::error::The zip must contain exactly zpolacode-mcp at its root."
            exit 1
          fi

      - name: Keep the artefact for the release job
        uses: actions/upload-artifact@v4
        with:
          name: zpolacode-mcp-${{ matrix.target }}
          path: |
            zpolacode-mcp-${{ matrix.target }}.zip
            zpolacode-mcp-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job needs to write: it creates the release
    steps:
      - name: Collect the five archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate and verify sha256sums.txt
        shell: bash
        run: |
          set -eu
          cd dist
          ls -l .
          if [ "$(ls -1 ./*.zip | wc -l)" -ne 5 ]; then
            echo "::error::Expected five archives, found $(ls -1 ./*.zip | wc -l)."
            exit 1
          fi
          # sed: strips a possible CR and guarantees one LF per entry, so the file
          # is readable by `sha256sum -c` on any platform.
          sed -e 's/\r$//' ./*.sha256 > sha256sums.txt
          sha256sum -c sha256sums.txt
          cat sha256sums.txt

      # softprops/action-gh-release rather than `gh release create`:
      # one declarative step for notes + asset upload, and fail_on_unmatched_files
      # turns a missing artefact into a red job instead of a silent half release.
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: zpolacode-mcp v${{ needs.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/sha256sums.txt
