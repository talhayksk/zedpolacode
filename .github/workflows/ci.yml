name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Zed compiles extensions with the WASI preview 2 target.
          targets: wasm32-wasip2
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Unit tests
        run: cargo test --workspace

      - name: Build extension
        run: cargo build --release --target wasm32-wasip2

      - name: Verify manifest and artifact
        run: |
          test -f extension.toml
          grep -q '^id = "zpolacode"' extension.toml
          test -f target/wasm32-wasip2/release/zedpolacode.wasm

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: zedpolacode-wasm
          path: target/wasm32-wasip2/release/zedpolacode.wasm
          if-no-files-found: error

  # The npm wrapper has no dependencies and its suite never touches the
  # network, so it needs nothing beyond Node. It also guards server.json, which
  # is only valid while it matches package.json.
  npm:
    name: npm wrapper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm/zpolacode-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node tests
        run: npm test
