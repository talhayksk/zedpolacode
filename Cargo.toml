[workspace]
members = [".", "crates/core"]
default-members = ["."]
resolver = "2"

[package]
name = "zedpolacode"
version = "0.1.2"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
polacode-core = { path = "crates/core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
